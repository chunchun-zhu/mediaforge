<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10111a"><title>MediaForge · 批量媒体工坊</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#10111a;--panel:#191a25;--panel2:#20212e;--line:#2b2c3a;--ink:#f5f5fa;--muted:#9394a6;--accent:#ad8cff;--mint:#85e0c1;--pink:#f2a6d5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0%,#28203e 0,transparent 37%),radial-gradient(ellipse at 100% 35%,#1b2635 0,transparent 30%),var(--bg);color:var(--ink);font:14px 'DM Sans','Noto Sans SC',sans-serif;min-height:100vh}.wrap{max-width:1160px;margin:auto;padding:30px 34px 60px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:64px}.brand{display:flex;gap:11px;align-items:center;font-weight:700;font-size:15px}.brand-icon{width:38px;height:38px;border:1px solid #ffffff20;background:linear-gradient(145deg,#bba1ff,#7c5ce5);border-radius:12px;display:grid;place-items:center;color:#171321;font-size:19px}.nav-label{color:var(--muted);font-size:12px}.hero{max-width:720px;margin:0 auto 34px;text-align:center}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#cab8ff;border:1px solid #ad8cff3b;background:#ad8cff12;padding:7px 11px;border-radius:99px;font-size:11px;letter-spacing:.5px}.dot{width:6px;height:6px;background:var(--mint);border-radius:50%;box-shadow:0 0 12px var(--mint)}h1{font-size:clamp(34px,5vw,54px);line-height:1.14;letter-spacing:-1.6px;margin:20px 0 13px}h1 span{background:linear-gradient(90deg,#c8b4ff,#f0b7dc);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{font-size:14px;line-height:1.8;color:var(--muted);margin:0}.workspace{max-width:920px;margin:auto;border:1px solid #ffffff15;background:linear-gradient(145deg,#1d1e2ad9,#161720e8);box-shadow:0 25px 100px #0005;border-radius:22px;overflow:hidden}.drop{margin:20px;border:1px dashed #666174;border-radius:16px;background:#ffffff03;min-height:150px;display:grid;place-items:center;text-align:center;padding:20px;transition:.2s}.drop.over{border-color:var(--accent);background:#ad8cff0d}.upload-icon{margin:0 auto 9px;width:36px;height:36px;border-radius:11px;background:#ad8cff1b;color:#c4adff;display:grid;place-items:center;font-size:18px}.drop strong{font-size:13px}.drop p{margin:6px;color:var(--muted);font-size:11px}.browse{color:#cfbdff;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.hint{font-size:10px!important;color:#747587!important}.files{display:flex;gap:8px;overflow:auto;padding:0 20px 14px}.file-chip{display:flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid var(--line);background:#ffffff06;border-radius:10px;padding:8px 10px;color:#d6d6df;font-size:11px}.file-chip button{border:0;background:none;color:#8d8d9d;cursor:pointer;font-size:15px}.settings{border-top:1px solid #ffffff10;padding:18px 22px 20px}.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.section-title b{font-size:12px}.section-title span{color:var(--muted);font-size:10px}.grid{display:grid;grid-template-columns:1.2fr .8fr 1fr 1fr;gap:14px}.field label{display:flex;justify-content:space-between;color:#b3b3c0;font-size:10px;margin-bottom:8px}.field input[type=text],.field select{width:100%;background:#13141d;border:1px solid #343543;color:#eeeef5;border-radius:9px;padding:10px 11px;outline:none}.field input:focus,.field select:focus{border-color:#ad8cff}.field select option{background:#191a25}.field input[type=range]{width:100%;accent-color:var(--accent)}.range-value{color:#d2c3ff!important}.positions{display:grid;grid-template-columns:repeat(3,24px);gap:4px;margin-top:4px}.pos{width:24px;height:20px;background:#292a38;border:1px solid #383947;border-radius:5px;cursor:pointer}.pos.active{background:#ad8cff;border-color:#ad8cff;box-shadow:0 0 9px #ad8cff77}.format-row{display:flex;gap:14px;margin-top:17px;align-items:center}.format{display:flex;align-items:center;gap:7px}.format label{font-size:10px;color:#b4b4c0}.format select{background:#13141d;color:#eee;border:1px solid #343543;padding:7px 9px;border-radius:8px;font-size:10px}.logo-control{font-size:10px;color:#cdbdff;cursor:pointer}.logo-control input{display:none}.action{border-top:1px solid #ffffff10;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.ready{color:var(--muted);font-size:10px}.go{display:flex;gap:9px;align-items:center;background:linear-gradient(110deg,#ad8cff,#d59be5);color:#171321;border:0;border-radius:10px;font-weight:700;padding:11px 17px;cursor:pointer;box-shadow:0 7px 23px #ad8cff24;transition:.2s}.go:hover{transform:translateY(-1px);filter:brightness(1.05)}.go:disabled{opacity:.45;cursor:not-allowed;transform:none}.spinner{width:13px;height:13px;border:2px solid #29233450;border-top-color:#211830;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.features{display:flex;justify-content:center;gap:22px;margin:22px auto;color:#898a9c;font-size:10px}.features span:before{content:'✦';color:#bba0ff;margin-right:6px}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,15px);opacity:0;background:#292a38;border:1px solid #ffffff1c;border-radius:11px;padding:11px 15px;color:white;box-shadow:0 10px 35px #0005;transition:.2s;z-index:3;font-size:12px}.toast.show{transform:translate(-50%,0);opacity:1}.progress{display:none;height:3px;background:#30313f}.progress i{display:block;width:25%;height:100%;background:linear-gradient(90deg,#ad8cff,#f0b7dc);animation:load 1.4s ease-in-out infinite alternate}@keyframes load{to{width:85%}}.foot{text-align:center;color:#666778;font-size:10px;margin-top:44px}@media(max-width:720px){.wrap{padding:18px 12px 40px}.nav{margin-bottom:45px}.grid{grid-template-columns:1fr 1fr}.drop{margin:12px;min-height:140px}.settings{padding:16px}.action{padding:14px 16px}.features{gap:12px;flex-wrap:wrap}}@media(max-width:420px){h1{font-size:34px}.grid{grid-template-columns:1fr 1fr}.format-row{flex-wrap:wrap}.ready{max-width:130px;line-height:1.5}}
</style></head><body><main class="wrap"><header class="nav"><div class="brand"><div class="brand-icon">✳</div>MEDIAFORGE</div><div class="nav-label">批量媒体处理 · 本机运行</div></header><section class="hero"><div class="eyebrow"><i class="dot"></i> YOUR CREATIVE WORKFLOW</div><h1>让每个文件，<span>自带风格</span></h1><p>批量加上你的专属水印，一键转换格式。<br>图片、视频都能轻松搞定。</p></section>
<section class="workspace"><div class="drop" id="drop"><div><div class="upload-icon">↥</div><strong>把图片或视频拖到这里</strong><p>或者 <label for="files" class="browse">浏览文件</label></p><p class="hint">最多 30 个文件 · 单个最大 200 MB · JPG / PNG / WEBP / MP4 / MOV / WEBM</p><input id="files" type="file" multiple accept="image/png,image/jpeg,image/webp,image/bmp,video/mp4,video/quicktime,video/webm" hidden></div></div><div class="files" id="fileList"></div>
<div class="settings"><div class="section-title"><b>水印设置</b><span>预览将在处理后应用</span></div><div class="grid"><div class="field"><label>水印文字</label><input id="watermark" type="text" maxlength="80" placeholder="输入品牌名或文字"></div><div class="field"><label>透明度 <span class="range-value" id="opacityValue">65%</span></label><input id="opacity" type="range" min="10" max="100" value="65"></div><div class="field"><label>水印大小 <span class="range-value" id="sizeValue">6%</span></label><input id="size" type="range" min="2" max="25" value="6"></div><div class="field"><label>水印位置</label><div class="positions" id="positions"></div></div></div>
<div class="format-row"><div class="format"><label>图片格式</label><select id="imageFormat"><option value="WEBP">WEBP</option><option value="PNG">PNG</option><option value="JPEG">JPEG</option></select></div><div class="format"><label>视频输出</label><select id="videoFormat"><option value="MP4">MP4</option><option value="GIF">GIF</option></select></div><label class="logo-control">＋ 添加 Logo<input id="logo" type="file" accept="image/png,image/jpeg,image/webp"></label><span id="logoName" style="font-size:10px;color:#aaa"></span></div></div>
<div class="progress" id="progress"><i></i></div><div class="action"><span class="ready" id="status">选择文件并设置水印，开始处理吧</span><button id="process" class="go" disabled><span>✦</span> 开始处理</button></div></section><div class="features"><span>图片与视频批处理</span><span>本机处理，保护隐私</span><span>ZIP 一键下载</span></div><footer class="foot">MEDIAFORGE · MADE FOR YOUR CREATIVE FLOW</footer></main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);let selected=[],position='bottom-right',logoFile=null;const positions=['top-left','top-center','top-right','center-left','center','center-right','bottom-left','bottom-center','bottom-right'];
function notify(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200)}
function addFiles(list){for(const f of list){if(!selected.some(x=>x.name===f.name&&x.size===f.size))selected.push(f)}if(selected.length>30){selected=selected.slice(0,30);notify('最多只能选择 30 个文件')}render()}
function render(){ $('#fileList').innerHTML=selected.map((f,i)=>`<div class="file-chip"><span>${f.type.startsWith('video')?'▣':'▧'}</span>${f.name.length>22?f.name.slice(0,19)+'…':f.name}<button data-i="${i}" title="移除">×</button></div>`).join('');$('#fileList').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected.splice(+b.dataset.i,1);render()});$('#process').disabled=!selected.length;$('#status').textContent=selected.length?`${selected.length} 个文件已就绪`:'选择文件并设置水印，开始处理吧'}
positions.forEach((p,i)=>{const b=document.createElement('button');b.className='pos'+(p===position?' active':'');b.title=p;b.onclick=()=>{position=p;document.querySelectorAll('.pos').forEach(x=>x.classList.remove('active'));b.classList.add('active')};if(i===0)$('#positions').innerHTML='';$('#positions').appendChild(b)})}
$('#files').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('#opacity').oninput=e=>$('#opacityValue').textContent=e.target.value+'%';$('#size').oninput=e=>$('#sizeValue').textContent=e.target.value+'%';$('#logo').onchange=e=>{logoFile=e.target.files[0]||null;$('#logoName').textContent=logoFile?logoFile.name:''};
const drop=$('#drop');drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');addFiles(e.dataTransfer.files)};
$('#process').onclick=async()=>{if(!$('#watermark').value.trim()&&!logoFile){notify('请先输入水印文字或添加 Logo');return}const form=new FormData();selected.forEach(f=>form.append('files',f));form.append('watermark_text',$('#watermark').value);if(logoFile)form.append('logo',logoFile);form.append('opacity',$('#opacity').value);form.append('size',$('#size').value);form.append('position',position);form.append('image_format',$('#imageFormat').value);form.append('video_format',$('#videoFormat').value);const b=$('#process');b.disabled=true;b.innerHTML='<i class="spinner"></i> 正在处理';$('#status').textContent='正在为你的文件添加水印并打包…';$('#progress').style.display='block';try{const r=await fetch('/api/process',{method:'POST',body:form});if(!r.ok){let d={};try{d=await r.json()}catch{}throw Error(d.detail||'处理失败，请重试')}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mediaforge-results.zip';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);$('#status').textContent='处理完成！ZIP 已开始下载';notify('处理完成，压缩包已下载')}catch(e){$('#status').textContent='处理遇到问题';notify(e.message)}finally{b.disabled=!selected.length;b.innerHTML='<span>✦</span> 开始处理';$('#progress').style.display='none'}};render();
</script></body></html>
